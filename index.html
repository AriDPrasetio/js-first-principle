<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS First Principle</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <a href="#main-content" class="u-skip-link">Lanjut ke Konten Utama</a>
    <header class="c-header">
      <div class="c-header__inner">
        <button
          type="button"
          id="sidebar-toggle"
          class="c-btn-icon"
          aria-label="Toggle Navigation"
        >
          <svg
            aria-hidden="true"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 12h18M3 6h18M3 18h18" />
          </svg>
        </button>
        <a href="#" class="c-header__logo">JS First Principles</a>
        <button
          type="button"
          id="theme-toggle"
          class="c-btn-icon"
          aria-label="Toggle Dark Mode"
        >
          <span class="theme-icon" aria-hidden="true">🌓</span>
        </button>
      </div>
    </header>
    <div class="o-layout">
      <!-- Sidebar Navigasi -->
      <nav class="c-sidebar o-layout__sidebar" aria-label="Sidebar Navigasi">
        <div id="nav-container" class="c-sidebar__content">
          <!-- Daftar modul & topik akan dirender JS di sini -->
        </div>
      </nav>
      <!-- Kontena Utama (Reader) -->
      <main id="main-content" class="c-reader o-layout__main">
        <article id="content-container" class="c-reader__content">
          <!-- Hasil parse Markdown akan dimuat di sini -->
          <h1>Selamat Datang di JS First Principles</h1>
          <p>Pilih topik di sidebar untuk mulai belajar.</p>
        </article>
      </main>
      <!-- Table of Contents (On this page) -->
      <aside class="c-toc o-layout__toc" aria-label="Table of Contents">
        <div class="c-toc__inner">
          <h3 class="c-toc__title">Di Halaman Ini</h3>
          <nav id="toc-container" class="c-toc__nav">
            <!-- Link heading akan digenerate otomatis di sini -->
          </nav>
        </div>
      </aside>
    </div>
    <script type="module" src="./src/config/curriculum.js"></script>
  </body>
</html>
