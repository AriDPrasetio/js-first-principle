<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan | typeof Operator</title>
    <style>
      .card {
        font-family: sans-serif;
        max-inline-size: 320px;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
        margin-inline: auto;
      }
      input,
      button {
        padding: 0.5rem;
        margin-block-start: 0.5rem;
        inline-size: 100%;
        box-sizing: border-box;
      }
      .hasil-box {
        margin-block-start: 0.75rem;
        padding: 0.5rem;
        background: #f4f4f4;
        border-radius: 0.25rem;
      }
    </style>
    <script src="app.js" defer="defer"></script>
  </head>
  <body>
    <div class="card">
      <h3>Pendeteksi Tipe Data Input</h3>
      <label for="input-usia">Masukkan Usia Anda&colon; </label>
      <input type="number" id="input-usia" value="25" />
      <button id="btn-cek">Cek Tipe Data via typeof</button>
      <div class="hasil-box">
        <p>Nilai Mentah&colon; <strong id="nilai-output">&dash;</strong></p>
        <p>
          Tipe Asli dari Input&colon; <strong id="tipe-output">&dash;</strong>
        </p>
      </div>
    </div>
  </body>
</html>
