<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan | Expression vs Statement</title>
    <style>
      body {
        font-family: sans-serif;
      }
      .card {
        max-inline-size: 320px;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 0.25rem;
        margin-inline: auto;
      }
      .output {
        font-family: monospace;
        font-size: 0.85rem;
        margin-block-start: 0.85rem;
        padding: 0.75rem;
      }
      button {
        padding: 0.5rem 0.75rem;
        margin-block-start: 0.5rem;
        cursor: pointer;
      }
    </style>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="card">
      <h3>Laboratorium Expression vs Statement</h3>
      <p>Klik tombol untuk menguji bagaimana JavaScript mengevaluasi kode:</p>
      <button type="button" id="btn-expression">
        Uji Expression (Ternary)
      </button>
      <button type="button" id="btn-statement">Uji Statement (if/else)</button>
      <div id="kotak-hasil" class="output">Klik salah satu tombol...</div>
    </div>
  </body>
</html>
