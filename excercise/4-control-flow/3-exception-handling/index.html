<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan | Exception Handling</title>
    <style>
      .card {
        font-family: sans-serif;
        max-inline-size: 320px;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
        margin-inline: auto;
      }
      input,
      button {
        box-sizing: border-box;
        padding: 0.5rem;
        margin-block-start: 0.5rem;
        inline-size: 100%;
      }
      .kotak-pesan {
        margin-block-start: 0.75rem;
        padding: 0.75rem;
        border-radius: 0.25rem;
        display: none;
      }
      .kotak-sukses {
        background-color: #e6f4ea;
        color: #137333;
        border: 1px solid #ceead6;
        display: block;
      }
      .kotak-error {
        background-color: #fce8e6;
        color: #c5221f;
        border: 1px solid #fad2cf;
        display: block;
      }
      .status-akhir {
        margin-block-start: 0.5rem;
        font-size: 0.8rem;
        color: #666;
        text-align: center;
      }
    </style>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="card">
      <h3>Bagi Tagihan Makan</h3>
      <label for="input-total">Total Tagihan (Rp):</label>
      <input type="text" id="input-total" value="100000" />
      <label for="input-orang">Jumlah Teman:</label>
      <input type="text" id="input-orang" value="4" />
      <button id="btn-hitung">Hitung Patungan</button>
      <div id="pesan-box" class="kotak-pesan"></div>
      <p id="status-final" class="status-akhir">-</p>
    </div>
  </body>
</html>
