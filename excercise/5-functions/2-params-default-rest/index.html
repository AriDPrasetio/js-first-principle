<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan | Default & Rest Parameter</title>
    <style>
      .card {
        font-family: sans-serif;
        max-inline-size: 320px;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
        margin-inline: auto;
      }
      input,
      button {
        box-sizing: border-box;
        padding: 0.5rem;
        margin-block-start: 0.5rem;
        inline-size: 100%;
      }
      .hasil-box {
        margin-block-start: 0.75rem;
        padding: 0.75rem;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 0.25rem;
      }
      ul {
        margin: 0.5rem 0 0 0;
        padding-inline-start: 1.25rem;
      }
    </style>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="card">
      <h3>Pembuat Undangan Acara</h3>
      <label for="input-acara">Nama Acara (Boleh Kosong):</label>
      <input
        type="text"
        name="input-acara"
        id="input-acara"
        placeholder="Default: Acara Syukuran"
      />
      <label for="input-tamu">Nama Tamu (Pisahkan koma):</label>
      <input
        type="text"
        name="input-tamu"
        id="input-tamu"
        value="Ari, Kyo, Devante"
      />
      <button type="button" id="btn-cetak">Cetak Undangan</button>
      <div id="wadah-hasil" class="hasil-box">
        Hasil undangan akan muncul di sini.
      </div>
    </div>
  </body>
</html>
